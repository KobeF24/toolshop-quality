name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'     # chaque nuit à 2 h (UTC)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRINT: sprint5
      DISABLE_LOGGING: 'true'
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
      CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      - name: Checkout Toolshop (application under test)
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: toolshop

      - name: Start Toolshop containers
        working-directory: toolshop
        run: docker compose -f docker-compose.yml up -d

      - name: Install API dependencies
        working-directory: toolshop
        run: |
          sleep 30
          docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi
      - name: Fix storage permissions
        working-directory: toolshop
        run: docker compose exec -T -u root laravel-api chmod -R 777 storage bootstrap/cache

      - name: Wait for database
        working-directory: toolshop
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent && exit 0
            sleep 2
          done
          exit 1

      - name: Seed database
        working-directory: toolshop
        run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

      - name: Wait for UI
        run: |
          for i in $(seq 1 60); do
            curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" | grep -q 200 && exit 0
            sleep 5
          done
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npx playwright test ${{ github.event_name == 'pull_request' && '--grep @smoke --project=chromium' || '' }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
